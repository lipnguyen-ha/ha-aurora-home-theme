    mdc-radio-unchecked-color: '#7D7D81'
    scrollbar-thumb-color: 'rgba(255, 255, 255, 0.20)'

    # =========================
    # CARD BEN THU BA
    # =========================
    # Bubble Card
    bubble-main-background-color: 'rgba(14, 22, 40, 0.60)'
    bubble-secondary-background-color: '#222225'
    bubble-accent-color: '#28B3F7'
    bubble-sub-button-dark-text-color: '#010101'
    bubble-border-radius: '16px'
    bubble-icon-border-radius: '50%'
    bubble-icon-background-color: 'rgba(255, 255, 255, 0.08)'
    bubble-sub-button-border-radius: '14px'
    bubble-sub-button-background-color: 'rgba(255, 255, 255, 0.08)'
    bubble-box-shadow: 'none'
    bubble-pop-up-border-radius: '28px'
    bubble-pop-up-main-background-color: '#1E2D52'
    bubble-pop-up-background-color: '#1E2D52'
    bubble-backdrop-background-color: 'rgba(0, 0, 0, 0.45)'
    bubble-select-list-border-radius: '16px'
    bubble-select-list-background-color: '#25355E'
    # Mushroom
    mush-rgb-state-light: '255, 209, 34'
    mush-rgb-state-switch: '255, 209, 34'
    mush-rgb-state-fan: '40, 179, 247'
    mush-rgb-state-climate-cool: '40, 179, 247'
    mush-rgb-state-climate-heat: '255, 159, 69'
    mush-rgb-state-media-player: '132, 212, 255'
    mush-rgb-state-vacuum: '255, 159, 69'
    mush-chip-border-radius: '9999px'
    mush-title-font-weight: '600'

    # Bien cho card tu to mau khi BAT (Bubble Card, Aurora Device Control Card), giong ban Plus.
    # Tren card BAT den dac, icon nam tren nen #222225 va nut phu #29292C (nhu nut nguon, nut remote
    # trong anh); tren card TAT trong mo thi nam tren nen trang 8%.
    # Khong dat card-on-icon-color: card tu dung mau thiet bi cho icon.
    card-on-background-color: '#17171A'
    card-on-border-color: 'transparent'
    card-on-text-color: '#FAFAFF'
    card-on-sub-button-background-color: '#29292C'
    card-on-icon-background-color: '#222225'
    card-on-quick-background-color: '#29292C'
    card-off-icon-mix: '0%'
    card-off-icon-background-color: 'rgba(255, 255, 255, 0.08)'
    ir-remote-quick-background: 'rgba(255, 255, 255, 0.08)'
    # Ten card dang TAT xam nhu tile tat (Aurora Device Control Card 2.2.3+)
    card-off-text-color: '#E0E0E5'

    # BAT: card den dac, icon co mau thiet bi tren vong tron #222225.
    # TAT: giu nen den trong mo, icon va chu xam tren vong tron trang 8%.
    # Chi ap dung cho thiet bi bat/tat duoc; sensor giu nen trong mo, chu den.
    card-mod-card: |
      /* Mau icon theo loai thiet bi. Dashboard co the ghi de bang --device-color tren ha-card. */
      ha-card:has(ha-tile-icon:is([data-domain="light"], [data-domain="switch"], [data-domain="input_boolean"])) { --things-device-color: #FFD122; }
      ha-card:has(ha-tile-icon:is([data-domain="fan"], [data-domain="climate"], [data-domain="cover"], [data-domain="humidifier"])) { --things-device-color: #28B3F7; }
      ha-card:has(ha-tile-icon[data-domain="media_player"]) { --things-device-color: #84D4FF; }
      ha-card:has(ha-tile-icon[data-domain="vacuum"]) { --things-device-color: #FF9F45; }
      ha-card:has(ha-tile-icon[data-domain="lock"]) { --things-device-color: #68C756; }
      ha-card:has(ha-tile-icon[data-domain="siren"]) { --things-device-color: #F4473B; }
      ha-card:has(ha-tile-icon[data-domain="remote"]) { --things-device-color: #8A8A8A; }

      /* TAT: chu va icon xam, vong tron trang 8% */
      ha-card:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) {
        --primary-text-color: #E0E0E5;
        --secondary-text-color: #ABABB0;
      }
      ha-card:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) ha-tile-icon {
        --tile-icon-color: #FFFFFF !important;
        --tile-icon-opacity: 0.08 !important;
      }
      ha-card:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) ha-tile-icon ha-state-icon {
        color: #AAAAAF !important;
      }

      /* BAT: nen den dac, chu trang, icon mau thiet bi tren vong tron #222225 */
      ha-card.active:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) {
        background: var(--card-on-background-color) !important;
        border-color: transparent !important;
        --primary-text-color: #FAFAFF;
        --secondary-text-color: #7D7D81;
        --ha-card-backdrop-filter: none;
      }
      ha-card.active:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) ha-tile-icon {
        --tile-icon-color: #222225 !important;
        --tile-icon-opacity: 1 !important;
      }
      ha-card.active:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) ha-tile-icon ha-state-icon {
        color: var(--device-color, var(--things-device-color)) !important;
      }

      /* Sub-button cua Bubble Card khi bat: xam toi nhu nut remote tren card bat */
      .bubble-sub-button.background-on {
        background-color: #29292C !important;
        color: #FAFAFF !important;
      }
      .bubble-sub-button.background-on .bubble-sub-button-icon {
        color: #FAFAFF !important;
      }

