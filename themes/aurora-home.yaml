    secondary-background-color: '#1B2A4E'
    clear-background-color: '#1B2A4E'

    # =========================
    # CARD
    # =========================
    # Card TAT va card sensor: navy dam 60%, nhin xuyen hinh nen, de khac han card BAT den dac (xem card-mod-card).
