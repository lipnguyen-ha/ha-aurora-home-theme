    state-fan-active-color: '#28B3F7'
    state-climate-cool-color: '#28B3F7'
    state-climate-dry-color: '#84D4FF'
    state-climate-fan_only-color: '#84D4FF'
    state-climate-heat-color: '#FF9F45'
    state-climate-auto-color: '#68C756'
    state-media_player-active-color: '#84D4FF'
    state-vacuum-active-color: '#FF9F45'
    state-cover-active-color: '#28B3F7'
    state-lock-locked-color: '#68C756'
    state-lock-unlocked-color: '#F4473B'
    state-binary_sensor-active-color: '#FFD122'
    state-person-home-color: '#68C756'

    label-badge-red: '#F4473B'
    label-badge-blue: '#28B3F7'
    label-badge-green: '#68C756'
    label-badge-yellow: '#FFD122'
    label-badge-grey: '#7D7D81'
    label-badge-text-color: '#FAFAFF'
    label-badge-background-color: '#17171A'

    # =========================
    # THANH TREN / SIDEBAR
    # =========================
    app-header-backdrop-filter: 'blur(24px) saturate(140%)'
    app-header-text-color: '#FFFFFF'
    app-header-selection-bar-color: '#FFFFFF'
    app-header-edit-background-color: 'rgba(23, 23, 26, 0.85)'
    app-header-edit-text-color: '#FFFFFF'
    # Sidebar trong anh mau la lop toi trong mo phu len hinh nen: xanh cham o tren, nga tim than o duoi.
    # Mau dac nay la mau giua, dung khi card-mod chua chay; card-mod-sidebar ben duoi to gradient.
    sidebar-background-color: '#343C68'
    card-mod-sidebar: |
      :host {
        background: linear-gradient(180deg, #303E72 0%, #343C68 45%, #383960 75%, #3E3C5E 100%) !important;
      }
    sidebar-text-color: 'rgba(250, 250, 255, 0.80)'
    sidebar-icon-color: '#C8CCD8'
    sidebar-selected-text-color: '#FAFAFF'
    sidebar-selected-icon-color: '#FAFAFF'

    # =========================
    # HOP THOAI / MENU
    # =========================
    # Nen hover/khi chon cua card trong trang Cai dat (vd. danh sach Apps): xanh navy sang hon nen trang
    ha-color-fill-neutral-quiet-resting: 'rgba(120, 150, 220, 0.16)'
    ha-color-fill-neutral-quiet-hover: 'rgba(120, 150, 220, 0.24)'
    ha-dialog-surface-background: '#1E2D52'
    ha-dialog-border-radius: '28px'
    ha-bottom-sheet-surface-background: '#1E2D52'
    mdc-dialog-scrim-color: 'rgba(0, 0, 0, 0.50)'
    mdc-theme-surface: '#25355E'
    md-menu-container-color: '#25355E'
    wa-color-surface-raised: '#25355E'
    code-editor-background-color: '#17171A'

    # =========================
    # O NHAP / CONG TAC / THANH TRUOT
    # =========================
    input-fill-color: 'rgba(255, 255, 255, 0.06)'
    input-ink-color: '#FAFAFF'
    input-label-ink-color: '#AAAAAF'
    input-disabled-fill-color: 'rgba(255, 255, 255, 0.03)'
    input-disabled-ink-color: 'rgba(255, 255, 255, 0.32)'
    input-idle-line-color: 'rgba(255, 255, 255, 0.14)'
    input-hover-line-color: '#7D7D81'
    input-dropdown-icon-color: '#AAAAAF'
    mdc-text-field-fill-color: 'rgba(255, 255, 255, 0.06)'
    mdc-select-fill-color: 'rgba(255, 255, 255, 0.06)'
    ha-color-form-background: 'rgba(255, 255, 255, 0.06)'
    ha-color-form-background-hover: 'rgba(255, 255, 255, 0.10)'
    ha-color-form-background-disabled: 'rgba(255, 255, 255, 0.03)'

    switch-checked-button-color: '#FFFFFF'
    switch-checked-track-color: '#28B3F7'
    switch-unchecked-button-color: '#FFFFFF'
    switch-unchecked-track-color: 'rgba(255, 255, 255, 0.22)'
    ha-switch-checked-background-color: '#28B3F7'
    ha-switch-checked-background-color-hover: '#3CBBF8'
    ha-switch-checked-thumb-background-color: '#FFFFFF'
    ha-switch-checked-thumb-background-color-hover: '#FFFFFF'
    ha-switch-background-color: 'rgba(255, 255, 255, 0.22)'
    ha-switch-background-color-hover: 'rgba(255, 255, 255, 0.30)'
    ha-switch-thumb-background-color: '#FFFFFF'
    ha-switch-thumb-background-color-hover: '#FFFFFF'
    paper-slider-knob-color: '#28B3F7'
    paper-slider-active-color: '#28B3F7'
    paper-slider-secondary-color: '#3A3A3E'
    mdc-checkbox-unchecked-color: '#7D7D81'
    mdc-radio-unchecked-color: '#7D7D81'
    scrollbar-thumb-color: 'rgba(255, 255, 255, 0.20)'

    # =========================
    # CARD BEN THU BA
    # =========================
    # Bubble Card
    bubble-main-background-color: 'rgba(14, 22, 40, 0.60)'
    bubble-secondary-background-color: '#222225'
    bubble-accent-color: '#28B3F7'
    bubble-sub-button-dark-text-color: '#010101'
    bubble-border-radius: '16px'
    bubble-icon-border-radius: '50%'
    bubble-icon-background-color: 'rgba(255, 255, 255, 0.08)'
    bubble-sub-button-border-radius: '14px'
    bubble-sub-button-background-color: 'rgba(255, 255, 255, 0.08)'
    bubble-box-shadow: 'none'
    bubble-pop-up-border-radius: '28px'
    bubble-pop-up-main-background-color: '#1E2D52'
    bubble-pop-up-background-color: '#1E2D52'
    bubble-backdrop-background-color: 'rgba(0, 0, 0, 0.45)'
    bubble-select-list-border-radius: '16px'
    bubble-select-list-background-color: '#25355E'
    # Mushroom
    mush-rgb-state-light: '255, 209, 34'
    mush-rgb-state-switch: '255, 209, 34'
    mush-rgb-state-fan: '40, 179, 247'
    mush-rgb-state-climate-cool: '40, 179, 247'
    mush-rgb-state-climate-heat: '255, 159, 69'
    mush-rgb-state-media-player: '132, 212, 255'
    mush-rgb-state-vacuum: '255, 159, 69'
    mush-chip-border-radius: '9999px'
    mush-title-font-weight: '600'

    # Bien cho card tu to mau khi BAT (Bubble Card, Aurora Device Control Card), giong ban Plus.
    # Tren card BAT trang, icon va nut phu nam tren nen xam nhat #F1F1F5; tren card TAT trong mo
    # thi nam tren nen trang 8%.
    # Khong dat card-on-icon-color: card tu dung mau thiet bi cho icon.
    card-on-background-color: '#FCFCFC'
    card-on-border-color: 'transparent'
    card-on-text-color: '#010101'
    card-on-sub-button-background-color: '#F1F1F5'
    card-on-icon-background-color: '#F1F1F5'
    card-on-quick-background-color: '#F1F1F5'
    card-off-icon-mix: '0%'
    card-off-icon-background-color: 'rgba(255, 255, 255, 0.08)'
    ir-remote-quick-background: 'rgba(255, 255, 255, 0.08)'
    # Ten card dang TAT xam nhu tile tat (Aurora Device Control Card 2.2.3+)
    card-off-text-color: '#E0E0E5'

    # BAT: card trang dac, chu den, icon co mau thiet bi tren vong tron xam nhat #F1F1F5.
    # TAT: giu nen den trong mo, icon va chu xam tren vong tron trang 8%.
    # Chi ap dung cho thiet bi bat/tat duoc; sensor giu nen trong mo, chu den.
    card-mod-card: |
      /* Mau icon theo loai thiet bi. Dashboard co the ghi de bang --device-color tren ha-card. */
      ha-card:has(ha-tile-icon:is([data-domain="light"], [data-domain="switch"], [data-domain="input_boolean"])) { --things-device-color: #F5B700; }
      ha-card:has(ha-tile-icon:is([data-domain="fan"], [data-domain="climate"], [data-domain="cover"], [data-domain="humidifier"])) { --things-device-color: #1E9FE0; }
      ha-card:has(ha-tile-icon[data-domain="media_player"]) { --things-device-color: #3DB2F0; }
      ha-card:has(ha-tile-icon[data-domain="vacuum"]) { --things-device-color: #F08A2C; }
      ha-card:has(ha-tile-icon[data-domain="lock"]) { --things-device-color: #4CB944; }
      ha-card:has(ha-tile-icon[data-domain="siren"]) { --things-device-color: #F4473B; }
      ha-card:has(ha-tile-icon[data-domain="remote"]) { --things-device-color: #8A8A8A; }

      /* TAT: chu va icon xam, vong tron trang 8% */
      ha-card:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) {
        --primary-text-color: #E0E0E5;
        --secondary-text-color: #ABABB0;
      }
      ha-card:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) ha-tile-icon {
        --tile-icon-color: #FFFFFF !important;
        --tile-icon-opacity: 0.08 !important;
      }
      ha-card:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) ha-tile-icon ha-state-icon {
        color: #AAAAAF !important;
      }

      /* BAT: nen trang dac, chu den, icon mau thiet bi tren vong tron xam nhat */
      ha-card.active:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) {
        background: var(--card-on-background-color) !important;
        border-color: transparent !important;
        --primary-text-color: #010101;
        --secondary-text-color: #8A8A8A;
        --ha-card-backdrop-filter: none;
      }
      ha-card.active:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) ha-tile-icon {
        --tile-icon-color: #F1F1F5 !important;
        --tile-icon-opacity: 1 !important;
      }
      ha-card.active:has(ha-tile-icon:is(
          [data-domain="light"], [data-domain="switch"], [data-domain="fan"],
          [data-domain="input_boolean"], [data-domain="climate"], [data-domain="media_player"],
          [data-domain="vacuum"], [data-domain="cover"], [data-domain="lock"],
          [data-domain="humidifier"], [data-domain="siren"], [data-domain="remote"])) ha-tile-icon ha-state-icon {
        color: var(--device-color, var(--things-device-color)) !important;
      }

      /* Sub-button cua Bubble Card khi bat: xam nhat, chu den */
      .bubble-sub-button.background-on {
        background-color: #F1F1F5 !important;
        color: #010101 !important;
      }
      .bubble-sub-button.background-on .bubble-sub-button-icon {
        color: #010101 !important;
      }
