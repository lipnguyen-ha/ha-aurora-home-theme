    mdc-text-field-fill-color: 'rgba(255, 255, 255, 0.06)'
    mdc-select-fill-color: 'rgba(255, 255, 255, 0.06)'
    ha-color-form-background: 'rgba(255, 255, 255, 0.06)'
    ha-color-form-background-hover: 'rgba(255, 255, 255, 0.10)'
    ha-color-form-background-disabled: 'rgba(255, 255, 255, 0.03)'

    switch-checked-button-color: '#FFFFFF'
    switch-checked-track-color: '#28B3F7'
    switch-unchecked-button-color: '#FFFFFF'
    switch-unchecked-track-color: 'rgba(255, 255, 255, 0.22)'
    ha-switch-checked-background-color: '#28B3F7'
    ha-switch-checked-background-color-hover: '#3CBBF8'
    ha-switch-checked-thumb-background-color: '#FFFFFF'
