# =========================
# AURORA HOME THINGS DARK: NEN TOI
# =========================
# Phong cach app nha thong minh, mau do tu anh chup kieu toi cua app: hinh nen cham sang xanh ngoc,
# card BAT den dac #17171A, card TAT den trong mo (nhin xuyen hinh nen), icon co mau thiet bi khi bat.
# Can card-mod nhu ban Plus. Chi co kieu toi.
# Khong ke thua Aurora Home, vi phai ghi de gan het khoa (HA bao "duplicate key" cho moi khoa bi ghi de).
Aurora Home Things Dark:
  # Do tu anh mau: vung xanh bac ha sang nhat o mep phai khoang 45% chieu cao, xanh duong o goc tren phai,
  # tim than o duoi trai, nen cham toi dan sang xanh tu trai qua phai.
  things-wallpaper: >-
    radial-gradient(ellipse 55% 42% at 100% 45%, rgba(86, 169, 155, 1) 0%, rgba(86, 169, 155, 0) 72%),
    radial-gradient(ellipse 60% 38% at 100% 0%, rgba(55, 119, 161, 1) 0%, rgba(55, 119, 161, 0) 75%),
    radial-gradient(ellipse 70% 65% at 0% 90%, rgba(62, 62, 101, 1) 0%, rgba(62, 62, 101, 0) 75%),
    linear-gradient(100deg, #2F3F77 0%, #344170 28%, #315A8F 58%, #3777A1 82%, #3B6A82 100%)
  app-theme-color: '#2F3F77'
  app-header-background-color: 'rgba(52, 72, 136, 0.75)'
  # HA 2026.8+ yeu cau khoi modes khong rong. Chi khai bao "dark" de HA luon chay theme nay o che do toi,
  # ke ca khi trinh duyet dang o che do sang: neu khong, HA dung bo token sang (ha-color-*) va cac o hover,
  # o tim kiem trong trang Cai dat bi sang/den lech tong.
  modes:
    dark:
      app-theme-color: '#2F3F77'

  # Phan con lai cua ban toi.
  <<: &aurora_home_things_dark
    card-mod-theme: 'Aurora Home Things Dark'

    # =========================
    # NEN
    # =========================
    lovelace-background: 'var(--things-wallpaper) fixed'
    background-image: 'var(--things-wallpaper)'
    # Trang khong phai dashboard (Cai dat, Nhat ky...): xanh navy dam cung tong voi hinh nen
