    # =========================
    # O NHAP / CONG TAC / THANH TRUOT
    # =========================
    input-fill-color: 'rgba(255, 255, 255, 0.06)'
    input-ink-color: '#FAFAFF'
    input-label-ink-color: '#AAAAAF'
